name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy site + backend to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        with:
          host: 179.199.134.171
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ADMIN_TOKEN
          script: |
            set -e

            echo "== 1. Sincronizando arquivos do site =="
            cd /var/www/observatoriopetrolina
            git fetch origin main
            git reset --hard origin/main

            echo "== 2. Instalando dependencias do backend =="
            apt-get update -qq
            apt-get install -y -qq python3-flask python3-gunicorn

            echo "== 3. Escrevendo app da API =="
            mkdir -p /opt/observatorio-pesquisa
            cat > /opt/observatorio-pesquisa/app.py << 'PYEOF'
            import sqlite3, os, time
            from flask import Flask, request, jsonify

            DB_PATH = os.path.join(os.path.dirname(__file__), 'respostas.db')
            ADMIN_TOKEN = os.environ.get('ADMIN_TOKEN', '')
            app = Flask(__name__)

            INDICADORES_VALIDOS = {'ocupacao_hoteleira', 'iss_turismo', 'turistas_estimados'}

            def get_db():
                conn = sqlite3.connect(DB_PATH)
                conn.row_factory = sqlite3.Row
                return conn

            def init_db():
                conn = get_db()
                conn.execute('''
                    CREATE TABLE IF NOT EXISTS respostas (
                        id INTEGER PRIMARY KEY AUTOINCREMENT,
                        nota INTEGER NOT NULL,
                        recomenda TEXT,
                        voltaria TEXT,
                        gostou TEXT,
                        faltou TEXT,
                        origem TEXT,
                        ts INTEGER
                    )
                ''')
                conn.execute('''
                    CREATE TABLE IF NOT EXISTS indicadores (
                        chave TEXT PRIMARY KEY,
                        valor TEXT,
                        unidade TEXT,
                        fonte TEXT,
                        atualizado_em INTEGER
                    )
                ''')
                conn.commit()
                conn.close()

            init_db()

            def clip(v, n):
                return str(v)[:n] if v is not None else ''

            @app.route('/api/respostas', methods=['POST'])
            def criar_resposta():
                data = request.get_json(force=True, silent=True) or {}
                try:
                    nota = int(data.get('nota', 0))
                except (TypeError, ValueError):
                    nota = 0
                if not (1 <= nota <= 5):
                    return jsonify({'error': 'nota invalida'}), 400
                conn = get_db()
                conn.execute(
                    'INSERT INTO respostas (nota, recomenda, voltaria, gostou, faltou, origem, ts) VALUES (?, ?, ?, ?, ?, ?, ?)',
                    (
                        nota,
                        clip(data.get('recomenda'), 20),
                        clip(data.get('voltaria'), 20),
                        clip(data.get('gostou'), 500),
                        clip(data.get('faltou'), 500),
                        clip(data.get('origem'), 120),
                        int(data.get('ts') or 0),
                    )
                )
                conn.commit()
                conn.close()
                return jsonify({'ok': True}), 201

            @app.route('/api/respostas', methods=['GET'])
            def listar_respostas():
                conn = get_db()
                rows = conn.execute(
                    'SELECT nota, recomenda, voltaria, gostou, faltou, origem, ts FROM respostas ORDER BY id DESC LIMIT 500'
                ).fetchall()
                conn.close()
                return jsonify([dict(r) for r in rows])

            @app.route('/api/indicadores', methods=['GET'])
            def listar_indicadores():
                conn = get_db()
                rows = conn.execute('SELECT chave, valor, unidade, fonte, atualizado_em FROM indicadores').fetchall()
                conn.close()
                resultado = {chave: None for chave in INDICADORES_VALIDOS}
                for r in rows:
                    resultado[r['chave']] = dict(r)
                return jsonify(resultado)

            @app.route('/api/indicadores', methods=['POST'])
            def atualizar_indicador():
                token = request.headers.get('X-Admin-Token', '')
                if not ADMIN_TOKEN or token != ADMIN_TOKEN:
                    return jsonify({'error': 'nao autorizado'}), 401

                data = request.get_json(force=True, silent=True) or {}
                chave = data.get('chave', '')
                if chave not in INDICADORES_VALIDOS:
                    return jsonify({'error': 'indicador invalido'}), 400

                valor = clip(data.get('valor'), 40)
                unidade = clip(data.get('unidade'), 20)
                fonte = clip(data.get('fonte'), 200)

                conn = get_db()
                conn.execute(
                    '''INSERT INTO indicadores (chave, valor, unidade, fonte, atualizado_em)
                       VALUES (?, ?, ?, ?, ?)
                       ON CONFLICT(chave) DO UPDATE SET
                         valor=excluded.valor, unidade=excluded.unidade, fonte=excluded.fonte, atualizado_em=excluded.atualizado_em''',
                    (chave, valor, unidade, fonte, int(time.time()))
                )
                conn.commit()
                conn.close()
                return jsonify({'ok': True}), 200

            if __name__ == '__main__':
                app.run(host='127.0.0.1', port=5001)
            PYEOF

            echo "== 4. Configurando variavel de ambiente (senha de administrador) =="
            mkdir -p /etc/observatorio-pesquisa
            printf 'ADMIN_TOKEN=%s\n' "$ADMIN_TOKEN" > /etc/observatorio-pesquisa/env
            chmod 600 /etc/observatorio-pesquisa/env

            echo "== 5. Configurando servico systemd =="
            cat > /etc/systemd/system/observatorio-pesquisa.service << 'UNITEOF'
            [Unit]
            Description=Observatorio Petrolina - API da pesquisa
            After=network.target

            [Service]
            EnvironmentFile=/etc/observatorio-pesquisa/env
            WorkingDirectory=/opt/observatorio-pesquisa
            ExecStart=/usr/bin/python3 -m gunicorn -w 2 -b 127.0.0.1:5001 app:app
            Restart=always
            RestartSec=2
            User=root

            [Install]
            WantedBy=multi-user.target
            UNITEOF

            systemctl daemon-reload
            systemctl enable observatorio-pesquisa
            systemctl restart observatorio-pesquisa
            sleep 2

            echo "== 6. Adicionando rota /api/* no Caddy (idempotente) =="
            python3 << 'PYEOF'
            import re

            path = '/etc/caddy/Caddyfile'
            with open(path, encoding='utf-8') as f:
                content = f.read()

            if 'reverse_proxy 127.0.0.1:5001' in content:
                print("Rota /api/* ja configurada - pulando")
            else:
                pattern = re.compile(
                    r'(^observatoriopetrolina2\.com\.br,\s*www\.observatoriopetrolina2\.com\.br\s*\{)(.*?)(^\})',
                    re.MULTILINE | re.DOTALL
                )
                m = pattern.search(content)
                if not m:
                    print("ERRO: bloco do dominio observatoriopetrolina2.com.br nao encontrado no Caddyfile")
                else:
                    new_block = (
                        "observatoriopetrolina2.com.br, www.observatoriopetrolina2.com.br {\n"
                        "    handle /api/* {\n"
                        "        reverse_proxy 127.0.0.1:5001\n"
                        "    }\n"
                        "    handle {\n"
                        "        root * /var/www/observatoriopetrolina\n"
                        "        file_server\n"
                        "    }\n"
                        "    encode gzip\n"
                        "}\n"
                    )
                    content = content[:m.start()] + new_block + content[m.end():]
                    with open(path, 'w', encoding='utf-8') as f:
                        f.write(content)
                    print("Caddyfile atualizado com rota /api/*")
            PYEOF

            caddy validate --config /etc/caddy/Caddyfile
            systemctl reload caddy
            sleep 1

            echo "== 7. Diagnostico =="
            echo "-- status do backend --"
            systemctl is-active observatorio-pesquisa || true
            journalctl -u observatorio-pesquisa --no-pager -n 15 || true
            echo "-- teste local /api/respostas (deve retornar 200) --"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:5001/api/respostas || echo "FALHA ao conectar no backend local"
            echo "-- teste local /api/indicadores (deve retornar 200) --"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:5001/api/indicadores || echo "FALHA ao conectar no backend local"
            echo "-- confirmando rota no Caddyfile --"
            grep -n "reverse_proxy 127.0.0.1:5001" /etc/caddy/Caddyfile || echo "AVISO: rota /api NAO encontrada no Caddyfile"
            echo "-- teste via dominio publico (deve retornar 200) --"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" https://observatoriopetrolina2.com.br/api/indicadores || echo "FALHA ao conectar via dominio publico"

            echo "== DEPLOY CONCLUIDO =="
