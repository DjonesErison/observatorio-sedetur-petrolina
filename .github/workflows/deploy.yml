name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy site + backend to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 179.199.134.171
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "== 1. Sincronizando arquivos do site =="
            cd /var/www/observatoriopetrolina
            git fetch origin main
            git reset --hard origin/main

            echo "== 2. Instalando dependencias do backend =="
            apt-get update -qq
            apt-get install -y -qq python3-flask python3-gunicorn

            echo "== 3. Escrevendo app da API =="
            mkdir -p /opt/observatorio-pesquisa
            cat > /opt/observatorio-pesquisa/app.py << 'PYEOF'
            import sqlite3, os
            from flask import Flask, request, jsonify

            DB_PATH = os.path.join(os.path.dirname(__file__), 'respostas.db')
            app = Flask(__name__)

            def get_db():
                conn = sqlite3.connect(DB_PATH)
                conn.row_factory = sqlite3.Row
                return conn

            def init_db():
                conn = get_db()
                conn.execute('''
                    CREATE TABLE IF NOT EXISTS respostas (
                        id INTEGER PRIMARY KEY AUTOINCREMENT,
                        nota INTEGER NOT NULL,
                        recomenda TEXT,
                        voltaria TEXT,
                        gostou TEXT,
                        faltou TEXT,
                        origem TEXT,
                        ts INTEGER
                    )
                ''')
                conn.commit()
                conn.close()

            init_db()

            def clip(v, n):
                return str(v)[:n] if v is not None else ''

            @app.route('/api/respostas', methods=['POST'])
            def criar_resposta():
                data = request.get_json(force=True, silent=True) or {}
                try:
                    nota = int(data.get('nota', 0))
                except (TypeError, ValueError):
                    nota = 0
                if not (1 <= nota <= 5):
                    return jsonify({'error': 'nota invalida'}), 400
                conn = get_db()
                conn.execute(
                    'INSERT INTO respostas (nota, recomenda, voltaria, gostou, faltou, origem, ts) VALUES (?, ?, ?, ?, ?, ?, ?)',
                    (
                        nota,
                        clip(data.get('recomenda'), 20),
                        clip(data.get('voltaria'), 20),
                        clip(data.get('gostou'), 500),
                        clip(data.get('faltou'), 500),
                        clip(data.get('origem'), 120),
                        int(data.get('ts') or 0),
                    )
                )
                conn.commit()
                conn.close()
                return jsonify({'ok': True}), 201

            @app.route('/api/respostas', methods=['GET'])
            def listar_respostas():
                conn = get_db()
                rows = conn.execute(
                    'SELECT nota, recomenda, voltaria, gostou, faltou, origem, ts FROM respostas ORDER BY id DESC LIMIT 500'
                ).fetchall()
                conn.close()
                return jsonify([dict(r) for r in rows])

            if __name__ == '__main__':
                app.run(host='127.0.0.1', port=5001)
            PYEOF

            echo "== 4. Configurando servico systemd =="
            cat > /etc/systemd/system/observatorio-pesquisa.service << 'UNITEOF'
            [Unit]
            Description=Observatorio Petrolina - API da pesquisa
            After=network.target

            [Service]
            WorkingDirectory=/opt/observatorio-pesquisa
            ExecStart=/usr/bin/gunicorn -w 2 -b 127.0.0.1:5001 app:app
            Restart=always
            User=root

            [Install]
            WantedBy=multi-user.target
            UNITEOF

            systemctl daemon-reload
            systemctl enable --now observatorio-pesquisa
            systemctl restart observatorio-pesquisa

            echo "== 5. Adicionando rota /api/* no Caddy (idempotente) =="
            python3 << 'PYEOF'
            path = '/etc/caddy/Caddyfile'
            with open(path, encoding='utf-8') as f:
                content = f.read()

            old = """observatoriopetrolina2.com.br, www.observatoriopetrolina2.com.br {
                root * /var/www/observatoriopetrolina
                file_server
                encode gzip
            }"""

            new = """observatoriopetrolina2.com.br, www.observatoriopetrolina2.com.br {
                handle /api/* {
                    reverse_proxy 127.0.0.1:5001
                }
                handle {
                    root * /var/www/observatoriopetrolina
                    file_server
                }
                encode gzip
            }"""

            if old in content:
                content = content.replace(old, new)
                with open(path, 'w', encoding='utf-8') as f:
                    f.write(content)
                print("Caddyfile atualizado com rota /api/*")
            else:
                print("Bloco antigo nao encontrado (ja atualizado antes) - pulando")
            PYEOF

            caddy validate --config /etc/caddy/Caddyfile
            systemctl reload caddy

            echo "== DEPLOY CONCLUIDO COM SUCESSO =="

